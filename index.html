<!DOCTYPE html>
<html lang="kk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Months and Seasons – Grow your tree</title>
<style>
:root{color-scheme:dark;--tx:#fff}
*{box-sizing:border-box}html,body{margin:0}
body{background:linear-gradient(120deg,#6d28d9,#db2777,#f59e0b,#10b981,#0ea5e9);background-size:400% 400%;animation:bg 18s ease infinite;color:var(--tx);font-family:system-ui,"Segoe UI",sans-serif;min-height:100vh;padding:calc(18px + env(safe-area-inset-top,0px)) 14px calc(24px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
@keyframes bg{50%{background-position:100% 50%}}
h1{text-align:center;margin:0;font-size:clamp(28px,5.5vw,52px);text-shadow:0 4px 0 #0004}
.sub{text-align:center;margin:4px 0 12px;font-weight:600;text-shadow:0 2px 0 #0003}
.bar{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:16px;font-weight:700;flex-wrap:wrap}
.bar button{font:inherit;font-weight:700;border:0;border-radius:24px;padding:6px 16px;cursor:pointer;background:#fff;color:#4c1d95;box-shadow:0 4px 0 #0003}
.grid{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
.c{aspect-ratio:1/1;border:4px solid #fff9;border-radius:12% 50% 12% 50%;color:#fff;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:8px 6px 12px;box-shadow:0 8px 0 #0003,0 14px 24px #0003;transition:transform .2s;text-shadow:0 2px 0 #0004;overflow:hidden;user-select:none}
.c:hover{transform:scale(1.05) rotate(-2deg)}
.c:active{transform:scale(.96)}
.c.full{border-color:#facc15;box-shadow:0 0 0 4px #facc1588,0 14px 30px #0004}
.c svg{width:70%;flex:1;min-height:0}
.c .n{font-size:clamp(16px,2.4vw,24px);font-weight:800;text-align:center}
svg.tr{overflow:visible}
.gr{transform-box:fill-box;transform-origin:50% 100%;animation:gr 1.2s cubic-bezier(.2,1.4,.4,1)}
@keyframes gr{from{transform:scale(.75)}to{transform:scale(1)}}
.p{position:fixed;top:-60px;pointer-events:none;animation:fall linear forwards;z-index:9}
.bgl{opacity:.5}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
</style></head><body>
<h1>🌳 The Months and Seasons 🌳</h1>
<p class="sub">Tap your leaf – your tree grows!</p>
<div class="bar"><span id="cnt"></span><button id="un">↩️ Undo</button><button id="rs">♻️ Reset</button></div>
<div class="grid" id="grid"></div>
<script>
const names=["Айзере","Айлин","Еркеназ","Абзал","Рәбия","Айару","Диана","Аңсарбек","Абдумалик","Мирас","Әнел","Назерке"];
const BG=["linear-gradient(135deg,#2563eb,#22d3ee)","linear-gradient(135deg,#ec4899,#22c55e)","linear-gradient(135deg,#f59e0b,#06b6d4)","linear-gradient(135deg,#ea580c,#a21caf)"];
const MAX=8;
let G={},H=[];
try{G=JSON.parse(localStorage.getItem("sg5")||"{}");H=JSON.parse(localStorage.getItem("sh5")||"[]")}catch(e){}
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem("sg5",JSON.stringify(G));localStorage.setItem("sh5",JSON.stringify(H))}catch(e){}};
function tree(s,anim){
 const L="#22c55e",D="#16a34a",B="#92400e";
 let h=`<svg viewBox="0 0 100 120" class="tr"><ellipse cx="50" cy="112" rx="36" ry="7" fill="#7c4a1e"/><g class="${anim?"gr":""}">`;
 if(s==0)h+=`<ellipse cx="50" cy="106" rx="5" ry="4" fill="${B}"/>`;
 else if(s<3){const top=s==1?92:76;
  h+=`<rect x="48.5" y="${top}" width="3" height="${110-top}" rx="1.5" fill="${D}"/>`;
  h+=`<ellipse cx="42" cy="${top+3}" rx="8" ry="4" fill="${L}" transform="rotate(-25 42 ${top+3})"/><ellipse cx="58" cy="${top+1}" rx="8" ry="4" fill="${L}" transform="rotate(25 58 ${top+1})"/>`;
  if(s==2)h+=`<ellipse cx="41" cy="${top+17}" rx="8" ry="4" fill="${D}" transform="rotate(-25 41 ${top+17})"/><ellipse cx="59" cy="${top+15}" rx="8" ry="4" fill="${D}" transform="rotate(25 59 ${top+15})"/>`;
 } else {
  const th=[0,0,0,34,40,46,50,54,56][s];
  h+=`<rect x="45" y="${110-th}" width="10" height="${th}" rx="3" fill="${B}"/>`;
  const C={3:[[50,66,15]],4:[[50,56,17],[38,66,12],[62,66,12]],5:[[50,50,19],[36,62,14],[64,62,14]],6:[[36,52,16],[64,52,16],[50,38,19],[50,60,16]],7:[[34,50,17],[66,50,17],[50,34,21],[50,58,17],[50,44,14]]}[Math.min(s,7)];
  C.forEach((c,i)=>h+=`<circle cx="${c[0]}" cy="${c[1]}" r="${c[2]}" fill="${i%2?D:L}"/>`);
  if(s==8)[[38,44],[62,46],[30,56],[70,58],[50,26],[50,62],[44,52],[58,36]].forEach(a=>h+=`<circle cx="${a[0]}" cy="${a[1]}" r="3.8" fill="#ef4444"/><circle cx="${a[0]-1.2}" cy="${a[1]-1.2}" r="1" fill="#fff9"/>`);
 }
 return h+`</g></svg>`;
}
function burst(list,n,cls){
 for(let i=0;i<n;i++){const d=document.createElement("div");d.className="p "+(cls||"");
  d.textContent=list[i%list.length];d.style.left=Math.random()*100+"vw";
  d.style.fontSize=(20+Math.random()*34)+"px";
  d.style.animationDuration=(2+Math.random()*3)+"s";d.style.animationDelay=Math.random()*1.2+"s";
  document.body.appendChild(d);setTimeout(()=>d.remove(),7000)}
}
function card(i,anim){
 const n=names[i],s=G[n]||0,b=document.createElement("button");
 b.className="c"+(s==MAX?" full":"");b.style.background=BG[i%4];
 b.innerHTML=`${tree(s,anim)}<span class="n">${n}</span>`;
 b.onclick=()=>grow(i);return b;
}
function draw(){
 $("grid").innerHTML="";names.forEach((n,i)=>$("grid").appendChild(card(i,false)));
 $("cnt").textContent=`🍎 Fully grown: ${names.filter(n=>G[n]==MAX).length} / ${names.length}`;
}
function grow(i){
 const n=names[i];if((G[n]||0)>=MAX){burst(["🍎","⭐"],6);return}
 G[n]=(G[n]||0)+1;H.push(n);save();
 const old=$("grid").children[i];$("grid").replaceChild(card(i,true),old);
 $("cnt").textContent=`🍎 Fully grown: ${names.filter(x=>G[x]==MAX).length} / ${names.length}`;
 if(G[n]==MAX)burst(["🎉","⭐","🍎","🎊","✨","🌳"],70);else burst(["🍃","✨"],5);
}
$("un").onclick=()=>{const n=H.pop();if(n&&G[n]>0){G[n]--;save();draw()}};
$("rs").onclick=()=>{G={};H=[];save();draw()};
draw();
setInterval(()=>burst(["🍃","🍂","🌸","❄️"],2,"bgl"),2500);
</script></body></html>
